name: Publish @moqtap/collector

# The last release under the old name: a package that re-exports
# @moqtap/monitor-browser. Publish @moqtap/monitor-browser first.

on:
  push:
    tags:
      - 'collector-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#collector-v}"
          PKG_VERSION=$(node -p "require('./packages/collector/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify the re-exported version is on npm
        run: |
          DEP=$(node -p "require('./packages/collector/package.json').dependencies['@moqtap/monitor-browser']")
          npm view "@moqtap/monitor-browser@$DEP" version

      - name: Verify the moqtap.com page documents this version
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          node scripts/check-site-docs.mjs collector
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "::error::SITE_DEPLOY_TOKEN is not set, so moqtap.com could not be asked to publish this release's docs"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/codec build
      - run: bun run --cwd packages/monitor-browser build

      # Every entry resolves, in ESM and CJS, to the same module as the new name.
      - name: Check the re-exports
        run: node scripts/check-collector-shim.mjs

      - name: Publish @moqtap/collector
        run: npm publish --access public
        working-directory: packages/collector

      - name: Publish the docs on moqtap.com
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          repository: moqtap/site
          event-type: npm-docs-updated
          client-payload: '{"package": "collector", "tag": "${{ github.ref_name }}"}'
