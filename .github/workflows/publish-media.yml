name: Publish @moqtap/media

on:
  push:
    tags:
      - 'media-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#media-v}"
          PKG_VERSION=$(node -p "require('./packages/media/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # This package only: a sibling's failing test must not block its release.
      - run: bun run --cwd packages/media build
      - run: ./node_modules/.bin/biome check packages/media
      - run: ./node_modules/.bin/tsc --build packages/media
      - run: bun run --cwd packages/media test

      - name: Publish @moqtap/media
        run: npm publish --access public
        working-directory: packages/media
