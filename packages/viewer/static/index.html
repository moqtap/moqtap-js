<!doctype html>
<!--
  The view bundle's only page. It is served under `script-src 'self';
  style-src 'self'` with no 'unsafe-inline', so nothing on this page may be
  inline: no <script> without src, no <style>, no style="" attribute, no on*=
  handler. `src/__tests__/page.test.ts` holds it to that.

  tokens.css, bundle.css, fonts/ and licenses/ are moqtap's design system,
  vendored byte for byte; styles.css is this page's own layout on top of it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>.moqtrace viewer</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./bundle.css" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Blocking on purpose: it sets the parent's theme before the first paint. -->
    <script src="./theme-boot.js"></script>
    <script type="module" src="./main.js"></script>
  </head>

        <span id="wordmark-sep" class="mq-tool-header__sep" hidden></span>
        <h1 id="title" class="mq-tool-header__title vw-title">.moqtrace viewer</h1>
        <span id="facts" class="mq-muted mq-num vw-facts" hidden></span>
        <span id="draft" class="mq-badge mq-badge--draft" hidden></span>
        <span class="vw-spacer"></span>
        <!--
          Shown only for a trace the site inspector sent and marked as the
          CLI shell's recording: it asks that page to pass a request for the
          shell's own share dialog on, and carries nothing.
        -->
        <button id="share" class="mq-btn mq-btn--secondary" type="button" hidden>Share…</button>
        <!--
          Hidden until the script decides: shown on the viewer's own page
          and beside a capture the site inspector read itself, never beside
          a trace a parent handed over to be read (`canOfferLocalOpen`).
        -->
        <button id="open-capture" class="mq-btn mq-btn--quiet" type="button" hidden>
          Open capture
        </button>
        <input id="file-input" type="file" accept=".moqtrace" tabindex="-1" hidden />
      </header>

      <main id="surface" class="vw-surface">
        <div id="tabs" class="mq-tabs vw-tabs" role="tablist" aria-label="Views" hidden></div>

        <div id="empty" class="vw-empty">
          <div id="drop" class="mq-drop vw-drop">
            <span class="mq-empty__mark">.moqtrace</span>
            <h2 class="mq-empty__title">Open a MoQT session capture</h2>
            <p>
              Drop a <code>.moqtrace</code> file anywhere on this page, or choose one. It is
              decoded in this browser and never uploaded.
            </p>
            <button id="choose" class="mq-btn mq-btn--primary" type="button">Choose a file</button>
            <input id="empty-file-input" type="file" accept=".moqtrace" tabindex="-1" hidden />
          </div>
          <div id="error" class="mq-notice mq-notice--error vw-error" role="alert" hidden>
            <span class="mq-notice__icon" aria-hidden="true">✕</span>
            <div>
              <p class="mq-notice__title">This file can't be opened</p>
              <p id="error-text"></p>
              <p>Choose another .moqtrace file, or drop one on this page.</p>
            </div>
          </div>
        </div>

        <div id="results" class="vw-results" hidden></div>
      </main>
    </div>

    <!--
      A drop target the size of the window. Accepting a file only on one small
      rectangle makes people aim; this accepts it anywhere and draws the target
      only while a file is over the page.
    -->
    <div id="drop-overlay" class="mq-scrim vw-overlay" aria-hidden="true" hidden>
      <div class="mq-drop vw-overlay-target" data-over><strong>Drop to open</strong></div>
    </div>
  </body>
</html>
